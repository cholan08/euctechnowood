# Render Blueprint: one web service that runs the Express API and also serves the
# built frontend (client/dist). Accounts, clients, projects and images live on a
# persistent disk, so a paid plan is required.
projects:
  - name: euc-room-studio
    environments:
      - name: production
        services:
          - type: web
            name: euc-room-studio
            runtime: node
            plan: starter # persistent disks are not available on the free plan
            region: singapore
            branch: main
            # tsx (used by `npm start`) is a devDependency, and NODE_ENV=production
            # would otherwise make npm skip devDependencies. `npm run build` makes client/dist.
            buildCommand: npm ci --include=dev && npm run build
            startCommand: npm start
            healthCheckPath: /api/health
            autoDeployTrigger: commit
            # studio.db and stored images live here.
            disk:
              name: studio-data
              mountPath: /var/data
              sizeGB: 5
            buildFilter:
              paths:
                - server/**
                - shared/**
                - client/**
                - package.json
                - package-lock.json
            envVars:
              - key: NODE_VERSION
                value: "22"
              - key: NODE_ENV
                value: production
              - key: TRUST_PROXY
                value: "1"
              - key: DATA_DIR
                value: /var/data
              - key: IMAGE_PROVIDER
                value: xai
              - key: XAI_API_KEY
                sync: false # pasted into the Render dashboard, never committed
              # First admin, created only while the studio has no accounts.
              - key: ADMIN_EMAIL
                sync: false
              - key: ADMIN_PASSWORD
                sync: false
              - key: ADMIN_NAME
                value: Studio admin
